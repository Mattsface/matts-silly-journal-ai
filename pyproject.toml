[project]
name = "journal-ai"
version = "0.1.0"
description = "A private local assistant for an encrypted Markdown journal"
readme = "README.md"
authors = [
    { email = "spahmatthew@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
journal-ai = "journal_ai.cli:main"
[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
